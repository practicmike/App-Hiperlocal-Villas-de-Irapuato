openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: App Hiperlocal Villas de Irapuato
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: setup
  - name: auth
  - name: universe
  - name: admin
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ----------------------------------------------------------------- setup
  /setup/status:
    get:
      operationId: getSetupStatus
      tags: [setup]
      summary: Qué falta configurar (sin revelar secretos)
      responses:
        "200":
          description: Estado de la configuración
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
  /setup:
    post:
      operationId: runSetup
      tags: [setup]
      summary: Crea o actualiza las tablas y la cuenta del creador; entrega su llave
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "200":
          description: Listo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessKey"
        "401":
          description: Clave de configuración incorrecta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Falta configuración en el servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ------------------------------------------------------------------ auth
  /creator:
    get:
      operationId: getCreator
      tags: [auth]
      summary: Presentación pública del creador
      responses:
        "200":
          description: Creador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Creator"
  /auth/join:
    post:
      operationId: joinWithInvite
      tags: [auth]
      summary: Canjear un código de invitación; el vecino queda pendiente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinRequest"
      responses:
        "201":
          description: Solicitud registrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinResult"
        "400":
          description: Código inválido o ya usado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/key:
    post:
      operationId: loginWithKey
      tags: [auth]
      summary: Entrar con la llave personal; crea la sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyLoginRequest"
      responses:
        "200":
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: Llave inválida o revocada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "204":
          description: Sesión cerrada
  /me:
    get:
      operationId: getMe
      tags: [auth]
      responses:
        "200":
          description: Vecino con sesión
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: Sin sesión
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateMe
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: Actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"

  /me/sky:
    get:
      operationId: getMySky
      tags: [auth]
      summary: Credencial del vecino y estrellas que ya encendió
      responses:
        "200":
          description: Cielo personal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sky"
        "401":
          description: Sin sesión
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # -------------------------------------------------------------- comercio
  /merchant/login:
    post:
      operationId: merchantLogin
      tags: [merchant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyLoginRequest"
      responses:
        "200":
          description: Modo comercio abierto en este teléfono
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantMe"
        "401":
          description: Link inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /merchant/logout:
    post:
      operationId: merchantLogout
      tags: [merchant]
      responses:
        "204":
          description: Cerrado
  /merchant/me:
    get:
      operationId: getMerchantMe
      tags: [merchant]
      responses:
        "200":
          description: Comercio con modo comercio abierto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantMe"
        "401":
          description: Sin modo comercio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /merchant/members/{code}:
    get:
      operationId: merchantLookupMember
      tags: [merchant]
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Vecino de la credencial
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberLookup"
        "404":
          description: Credencial no válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /merchant/visits:
    post:
      operationId: merchantRecordVisit
      tags: [merchant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordVisitRequest"
      responses:
        "200":
          description: Visita registrada (o ya registrada hace poco)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitResult"

  # -------------------------------------------------------------- universe
  /universe:
    get:
      operationId: getUniverse
      tags: [universe]
      summary: Todas las estrellas activas
      responses:
        "200":
          description: Universo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Universe"
  /news:
    get:
      operationId: listNews
      tags: [universe]
      summary: Hoy en Villas (novedades vigentes)
      responses:
        "200":
          description: Novedades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsItem"
  /merchant/news:
    post:
      operationId: merchantPublishNews
      tags: [merchant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsInput"
      responses:
        "201":
          description: Publicada (reemplaza la anterior)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsItem"
    delete:
      operationId: merchantRemoveNews
      tags: [merchant]
      responses:
        "204":
          description: Quitada
  /merchant/news/{id}/photo:
    post:
      operationId: merchantNewsPhoto
      tags: [merchant]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Foto agregada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsItem"
  /admin/news:
    get:
      operationId: adminListNews
      tags: [admin]
      responses:
        "200":
          description: Novedades vigentes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsItem"
  /admin/places/{id}/news:
    post:
      operationId: adminPublishNews
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsInput"
      responses:
        "201":
          description: Publicada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsItem"
  /admin/news/{id}:
    delete:
      operationId: adminRemoveNews
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Quitada
  /admin/news/{id}/photo:
    post:
      operationId: adminNewsPhoto
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Foto agregada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsItem"
  /share/{slug}:
    get:
      operationId: getSharedPlace
      tags: [universe]
      summary: Tarjeta pública de una estrella (su link para compartir)
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tarjeta con contacto abierto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceDetail"
        "404":
          description: No existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /places/{id}/lead:
    post:
      operationId: recordLead
      tags: [universe]
      summary: Alguien de fuera contacta por WhatsApp (casa o link público)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadRequest"
      responses:
        "204":
          description: Registrado
  /admin/leads:
    get:
      operationId: adminListLeads
      tags: [admin]
      responses:
        "200":
          description: Interesados (últimos 500)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminLead"
  /admin/leads/{id}:
    delete:
      operationId: adminDeleteLead
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Borrado
  /admin/leads/clear:
    post:
      operationId: adminClearLeads
      tags: [admin]
      responses:
        "200":
          description: Cuántos se borraron
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClearVisitsResult"
  /places/{id}:
    get:
      operationId: getPlace
      tags: [universe]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Tarjeta de la estrella
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceDetail"
        "404":
          description: No existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /places/{id}/endorsement:
    put:
      operationId: endorsePlace
      tags: [universe]
      summary: Lo recomiendo
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndorseRequest"
      responses:
        "200":
          description: Recomendación guardada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceDetail"
    delete:
      operationId: removeEndorsement
      tags: [universe]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Recomendación retirada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceDetail"
  /places/{id}/contact:
    post:
      operationId: recordContact
      tags: [universe]
      summary: Registrar que el vecino abrió WhatsApp
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactRequest"
      responses:
        "204":
          description: Registrado
  /places/{id}/complaints:
    post:
      operationId: sendComplaint
      tags: [universe]
      summary: Queja privada que solo llega al creador
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplaintRequest"
      responses:
        "201":
          description: Enviada
  /search:
    post:
      operationId: search
      tags: [universe]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Coincidencias
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"

  # ----------------------------------------------------------------- admin
  /admin/overview:
    get:
      operationId: adminOverview
      tags: [admin]
      responses:
        "200":
          description: Señales de que funciona
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
  /admin/residents:
    get:
      operationId: adminListResidents
      tags: [admin]
      responses:
        "200":
          description: Vecinos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminResident"
  /admin/residents/{id}:
    put:
      operationId: adminUpdateResident
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResidentUpdate"
      responses:
        "204":
          description: Actualizado
        "400":
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: adminDeleteResident
      tags: [admin]
      summary: Borra al vecino y todo su rastro (visitas, recomendaciones, quejas, sesiones)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Borrado
        "400":
          description: No se puede borrar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/invites/{code}:
    delete:
      operationId: adminDeleteInvite
      tags: [admin]
      summary: Borra un código de invitación que nadie ha usado
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Borrado
  /admin/visits:
    get:
      operationId: adminListVisits
      tags: [admin]
      summary: Historial de credenciales escaneadas (últimas 500)
      responses:
        "200":
          description: Visitas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminVisit"
  /admin/visits/{id}:
    delete:
      operationId: adminDeleteVisit
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Borrada
  /admin/visits/clear:
    post:
      operationId: adminClearVisits
      tags: [admin]
      summary: Borra visitas en bloque (de un vecino, de un comercio o todas)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClearVisitsRequest"
      responses:
        "200":
          description: Cuántas se borraron
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClearVisitsResult"
  /admin/residents/{id}/approve:
    post:
      operationId: adminApproveResident
      tags: [admin]
      summary: Aprobar y generar su llave personal
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Llave generada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessKey"
  /admin/residents/{id}/key:
    post:
      operationId: adminRegenerateKey
      tags: [admin]
      summary: Generar llave nueva y revocar las anteriores
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Llave generada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessKey"
  /admin/residents/{id}/block:
    post:
      operationId: adminBlockResident
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Bloqueado
  /admin/invites:
    get:
      operationId: adminListInvites
      tags: [admin]
      responses:
        "200":
          description: Invitaciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invite"
    post:
      operationId: adminCreateInvite
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
      responses:
        "201":
          description: Creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
  /admin/places:
    get:
      operationId: adminListPlaces
      tags: [admin]
      responses:
        "200":
          description: Lugares, incluidos inactivos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminPlace"
    post:
      operationId: adminCreatePlace
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceInput"
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPlace"
  /admin/places/{id}:
    put:
      operationId: adminUpdatePlace
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceInput"
      responses:
        "200":
          description: Actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPlace"
    delete:
      operationId: adminDeletePlace
      tags: [admin]
      summary: Elimina una estrella para siempre (sus recomendaciones y quejas también)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Eliminada
  /admin/constellations:
    get:
      operationId: adminListConstellations
      tags: [admin]
      responses:
        "200":
          description: Constelaciones con su número de estrellas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminConstellation"
    post:
      operationId: adminCreateConstellation
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConstellationInput"
      responses:
        "201":
          description: Creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminConstellation"
  /admin/constellations/order:
    put:
      operationId: adminReorderConstellations
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderRequest"
      responses:
        "204":
          description: Orden guardado
  /admin/constellations/{cid}:
    parameters:
      - name: cid
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: adminUpdateConstellation
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConstellationInput"
      responses:
        "200":
          description: Actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminConstellation"
  /admin/constellations/{cid}/remove:
    parameters:
      - name: cid
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: adminRemoveConstellation
      tags: [admin]
      summary: Elimina una constelación; si tiene estrellas, se mueven a moveTo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveConstellationRequest"
      responses:
        "204":
          description: Eliminada
  /admin/places/{id}/photos:
    post:
      operationId: adminUploadPhoto
      tags: [admin]
      summary: Sube una foto (ya redimensionada en el celular) como binario
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Foto guardada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoRef"
  /admin/places/{id}/photos/order:
    put:
      operationId: adminReorderPhotos
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderRequest"
      responses:
        "204":
          description: Orden guardado (la primera es la portada)
  /admin/photos/{id}:
    delete:
      operationId: adminDeletePhoto
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Borrada
  /admin/places/{id}/merchant-key:
    post:
      operationId: adminIssueMerchantKey
      tags: [admin]
      summary: Crea (o reemplaza) el link del modo comercio
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Link nuevo; el anterior deja de funcionar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantKey"
  /admin/places/suggest:
    post:
      operationId: adminSuggestConstellation
      tags: [admin]
      summary: La IA sugiere constelación y giro para una estrella nueva
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestConstellationRequest"
      responses:
        "200":
          description: Sugerencia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestConstellationResult"
  /admin/demo-places:
    post:
      operationId: adminLoadDemoPlaces
      tags: [admin]
      summary: Carga 30 estrellas de ejemplo (10 por constelación); no duplica
      responses:
        "200":
          description: Cargadas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoResult"
    delete:
      operationId: adminRemoveDemoPlaces
      tags: [admin]
      summary: Borra solo las estrellas de ejemplo
      responses:
        "200":
          description: Borradas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoResult"
  /admin/searches:
    get:
      operationId: adminListSearches
      tags: [admin]
      responses:
        "200":
          description: Últimas búsquedas, sin resultado primero
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminSearch"
  /admin/searches/{id}:
    delete:
      operationId: adminDeleteSearch
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Borrada
  /admin/searches/clear:
    post:
      operationId: adminClearSearches
      tags: [admin]
      summary: Borra todas las búsquedas (para limpiar pruebas)
      responses:
        "200":
          description: Cuántas se borraron
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClearVisitsResult"
  /admin/searches/{id}/handled:
    post:
      operationId: adminMarkSearchHandled
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Atendida
  /admin/complaints:
    get:
      operationId: adminListComplaints
      tags: [admin]
      responses:
        "200":
          description: Quejas privadas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminComplaint"
  /admin/complaints/{id}/resolve:
    post:
      operationId: adminResolveComplaint
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Resuelta

components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    SetupStatus:
      type: object
      properties:
        setupEnabled:
          type: boolean
          description: Existe SETUP_TOKEN en el servidor
        databaseConfigured:
          type: boolean
        databaseReachable:
          type: boolean
        tablesReady:
          type: boolean
        hasAdmin:
          type: boolean
        problem:
          type: [string, "null"]
          description: Qué falta, en lenguaje simple
      required: [setupEnabled, databaseConfigured, databaseReachable, tablesReady, hasAdmin, problem]
    SetupRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 200
        name:
          type: string
          minLength: 2
          maxLength: 80
        phone:
          type: string
          minLength: 10
          maxLength: 20
      required: [token, name, phone]
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]
    Constellation:
      type: string
      description: Id de la constelación (hogar, resolver, …)
    ConstellationInfo:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        hint:
          type: string
        color:
          type: string
        isProperty:
          type: boolean
          description: Inmuebles (activa venta/renta y precio)
        position:
          type: integer
      required: [id, name, hint, color, isProperty, position]
    AdminConstellation:
      allOf:
        - $ref: "#/components/schemas/ConstellationInfo"
        - type: object
          properties:
            starCount:
              type: integer
          required: [starCount]
    ConstellationInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 24
        hint:
          type: string
          maxLength: 60
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        isProperty:
          type: boolean
      required: [name, hint, color, isProperty]
    RemoveConstellationRequest:
      type: object
      properties:
        moveTo:
          type: [string, "null"]
      required: [moveTo]
    ReorderRequest:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
      required: [ids]
    SuggestConstellationRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
        category:
          type: string
          maxLength: 60
        description:
          type: string
          maxLength: 1500
      required: [name, category, description]
    SuggestConstellationResult:
      type: object
      properties:
        constellation:
          type: [string, "null"]
        category:
          type: [string, "null"]
        reason:
          type: [string, "null"]
        available:
          type: boolean
      required: [constellation, category, reason, available]
    Creator:
      type: object
      properties:
        name:
          type: string
        message:
          type: string
        whatsapp:
          type: string
        photoUrl:
          type: [string, "null"]
        aiEnabled:
          type: boolean
      required: [name, message, whatsapp, photoUrl, aiEnabled]
    JoinRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 4
          maxLength: 32
        name:
          type: string
          minLength: 2
          maxLength: 80
        phone:
          type: string
          minLength: 10
          maxLength: 20
        zone:
          type: string
          maxLength: 80
      required: [code, name, phone]
    JoinResult:
      type: object
      properties:
        status:
          type: string
          enum: [pending]
        invitedBy:
          type: string
      required: [status, invitedBy]
    KeyLoginRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 200
      required: [token]
    Me:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [resident, admin]
        showNameOnEndorsements:
          type: boolean
      required: [id, name, role, showNameOnEndorsements]
    UpdateMeRequest:
      type: object
      properties:
        showNameOnEndorsements:
          type: boolean
      required: [showNameOnEndorsements]
    Sky:
      type: object
      properties:
        memberCode:
          type: string
        visits:
          type: array
          items:
            $ref: "#/components/schemas/SkyVisit"
      required: [memberCode, visits]
    SkyVisit:
      type: object
      properties:
        placeId:
          type: string
        count:
          type: integer
        lastAt:
          type: string
          format: date-time
      required: [placeId, count, lastAt]
    MerchantKey:
      type: object
      properties:
        token:
          type: string
        whatsapp:
          type: string
        placeName:
          type: string
      required: [token, whatsapp, placeName]
    MerchantMe:
      type: object
      properties:
        placeId:
          type: string
        placeName:
          type: string
        welcomeOffer:
          type: [string, "null"]
        todayVisits:
          type: integer
        totalVisits:
          type: integer
        neighbors:
          type: integer
        recent:
          type: array
          items:
            $ref: "#/components/schemas/MerchantRecentVisit"
        kind:
          $ref: "#/components/schemas/PlaceKind"
        news:
          anyOf:
            - $ref: "#/components/schemas/NewsItem"
            - type: "null"
        slug:
          type: [string, "null"]
      required: [placeId, placeName, welcomeOffer, todayVisits, totalVisits, neighbors, recent, kind, news, slug]
    MerchantRecentVisit:
      type: object
      properties:
        firstName:
          type: string
        at:
          type: string
          format: date-time
        welcomeApplied:
          type: boolean
      required: [firstName, at, welcomeApplied]
    MemberLookup:
      type: object
      properties:
        firstName:
          type: string
        visitsHere:
          type: integer
        welcomeOffer:
          type: [string, "null"]
          description: Solo si es su primera visita y el comercio tiene beneficio
        recentlyRecorded:
          type: boolean
          description: Ya se registró una visita en las últimas 2 horas
      required: [firstName, visitsHere, welcomeOffer, recentlyRecorded]
    RecordVisitRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 4
          maxLength: 20
      required: [code]
    VisitResult:
      type: object
      properties:
        firstName:
          type: string
        visitsHere:
          type: integer
        welcomeApplied:
          type: boolean
        welcomeOffer:
          type: [string, "null"]
        duplicate:
          type: boolean
      required: [firstName, visitsHere, welcomeApplied, welcomeOffer, duplicate]
    PhotoRef:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
        width:
          type: integer
        height:
          type: integer
      required: [id, url, width, height]
    DayHours:
      type: object
      properties:
        open:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        close:
          type: string
          pattern: "^([01][0-9]|2[0-4]):[0-5][0-9]$"
      required: [open, close]
    WeekHours:
      type: [array, "null"]
      description: 7 días de domingo a sábado; null = cerrado ese día
      minItems: 7
      maxItems: 7
      items:
        anyOf:
          - $ref: "#/components/schemas/DayHours"
          - type: "null"
    PlaceKind:
      type: string
      enum: [comercio, oficio]
    NewsItem:
      type: object
      properties:
        id:
          type: string
        placeId:
          type: string
        placeName:
          type: string
        constellation:
          type: string
        text:
          type: string
        photoUrl:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
      required: [id, placeId, placeName, constellation, text, photoUrl, createdAt, expiresAt]
    NewsInput:
      type: object
